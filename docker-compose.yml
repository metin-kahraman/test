services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    image: nextjs-app:latest
    container_name: nextjs-app-orange-dent
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s